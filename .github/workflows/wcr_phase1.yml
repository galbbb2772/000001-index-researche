name: WCR Phase 1 Inspect A-Share DB

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  inspect:
    if: startsWith(github.event.issue.title, 'WCR-RUN') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install --disable-pip-version-check duckdb==1.4.1 pandas numpy

      - name: Download survivorship-safe A-share snapshot
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ashare_pit.duckdb \
            "https://github.com/noblechang/a-share-data/releases/download/FREE_DATA_v0/ashare_pit.duckdb"
          ls -lh ashare_pit.duckdb

      - name: Inspect schema
        run: python research/wcr/inspect_db.py

      - name: Run WCR Phase 1 annual transition analysis
        run: python research/wcr/analyze_phase1.py

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: wcr-db-schema
          path: wcr_artifacts/schema.json
          retention-days: 7

      - name: Upload WCR Phase 1 results
        uses: actions/upload-artifact@v4
        with:
          name: wcr-phase1-results
          path: wcr_phase1/
          retention-days: 7
