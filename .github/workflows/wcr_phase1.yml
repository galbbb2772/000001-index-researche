name: WCR Phase 1 Inspect A-Share DB

on:
  push:
    branches:
      - main
    paths:
      - "research/wcr/**"
      - ".github/workflows/wcr_phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DuckDB
        run: pip install --disable-pip-version-check duckdb==1.4.1

      - name: Download survivorship-safe A-share snapshot
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            -o ashare_pit.duckdb \
            "https://github.com/noblechang/a-share-data/releases/download/FREE_DATA_v0/ashare_pit.duckdb"
          ls -lh ashare_pit.duckdb

      - name: Inspect schema
        run: python research/wcr/inspect_db.py

      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: wcr-db-schema
          path: wcr_artifacts/schema.json
          retention-days: 7
